<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AgroSense Dynamics | Feedback
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="navbar">

    <a href="index.html" class="logo">

        <span class="logo-icon">
            A
        </span>

        <span>
            AgroSense <b>Dynamics</b>
        </span>

    </a>


    <div class="nav-links">

        <a href="index.html">Home</a>
        <a href="overview.html">Overview</a>
        <a href="peacock.html">Peacock</a>
        <a href="theft.html">Motor Theft</a>
        <a href="snake.html">Snake</a>
        <a href="order.html">Order</a>

        <a href="feedback.html" class="active">
            Feedback
        </a>

    </div>

</nav>


<section class="page-header reveal">

    <div class="badge">
        YOUR FEEDBACK MATTERS
    </div>

    <h1>
        Help us
        <span class="gradient">
            improve.
        </span>
    </h1>

    <p>
        Share your thoughts about AgroSense Dynamics.
    </p>

</section>


<main>

<section class="feedback glass reveal">


    <form
        action="https://formsubmit.co/agrosensedynamics@gmail.com"
        method="POST"
    >


        <input
            type="hidden"
            name="_subject"
            value="AGROSENSE DYNAMICS FEEDBACK"
        >


        <input
            type="hidden"
            name="_template"
            value="table"
        >


        <input
            type="hidden"
            name="_captcha"
            value="true"
        >


        <input
            type="hidden"
            name="_next"
            value="https://sanchith-star.github.io/tamsagrosense1/feedback-success.html"
        >


        <label>
            Name
        </label>

        <input
            type="text"
            name="Name"
            placeholder="Enter your name"
            required
        >


        <label>
            Star Rating
        </label>


        <div class="stars">

            <button
                type="button"
                class="star"
                data-rating="1"
            >
                ★
            </button>

            <button
                type="button"
                class="star"
                data-rating="2"
            >
                ★
            </button>

            <button
                type="button"
                class="star"
                data-rating="3"
            >
                ★
            </button>

            <button
                type="button"
                class="star"
                data-rating="4"
            >
                ★
            </button>

            <button
                type="button"
                class="star"
                data-rating="5"
            >
                ★
            </button>

        </div>


        <input
            type="hidden"
            id="rating"
            name="Star Rating"
            required
        >


        <label>
            Improvements Needed
        </label>

        <textarea
            name="Improvements Needed"
            placeholder="What should we improve?"
            required
        ></textarea>


        <label>
            Favorite Part
        </label>

        <textarea
            name="Favorite Part"
            placeholder="What did you like most?"
        ></textarea>


        <div class="button-row">

            <button
                type="submit"
                class="btn primary"
            >
                Send Feedback
                <span>→</span>
            </button>


            <button
                type="reset"
                class="btn btn-reset"
                id="resetFeedback"
            >
                Reset
            </button>

        </div>


    </form>

</section>

</main>


<footer>
    © 2026 AgroSense Dynamics. All Rights Reserved.
</footer>


<script src="script.js"></script>

</body>
</html>
