<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSense | Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <div class="logo-box">A</div>
        <span>AgroSense Dynamics</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="overview.html">Overview</a>
        <a href="peacock.html">Peacock</a>
        <a href="theft.html">Motor Theft</a>
        <a href="snake.html">Snake</a>
        <a href="order.html">Order</a>
        <a href="feedback.html" class="active">Feedback</a>
    </nav>

</header>

<main class="feedback-page">

    <div class="feedback-card">

        <div class="small-badge">YOUR FEEDBACK</div>

        <h1>
            Help us make<br>
            <span>AgroSense better.</span>
        </h1>

        <p>
            Your feedback helps us improve our agricultural
            protection system.
        </p>


        <form
            action="https://formsubmit.co/agrosensedynamics@gmail.com"
            method="POST"
        >

            <input type="hidden"
                   name="_subject"
                   value="AgroSense Dynamics Feedback">

            <input type="hidden"
                   name="_next"
                   value="https://sanchith-star.github.io/tamsagrosense1/feedback-success.html">

            <input type="hidden"
                   name="_captcha"
                   value="false">


            <div class="input-group">

                <label>Your Name</label>

                <input
                    type="text"
                    name="Name"
                    required
                >

            </div>


            <div class="input-group">

                <label>Star Rating</label>

                <div class="stars">

                    <input type="radio" id="star5"
                           name="Rating" value="5 Stars" required>
                    <label for="star5">★</label>

                    <input type="radio" id="star4"
                           name="Rating" value="4 Stars">
                    <label for="star4">★</label>

                    <input type="radio" id="star3"
                           name="Rating" value="3 Stars">
                    <label for="star3">★</label>

                    <input type="radio" id="star2"
                           name="Rating" value="2 Stars">
                    <label for="star2">★</label>

                    <input type="radio" id="star1"
                           name="Rating" value="1 Star">
                    <label for="star1">★</label>

                </div>

            </div>


            <div class="input-group">

                <label>Improvements Needed</label>

                <textarea
                    name="Improvements"
                    placeholder="Tell us what we can improve..."
                    required
                ></textarea>

            </div>


            <div class="input-group">

                <label>What did you like most?</label>

                <textarea
                    name="Favorite Part"
                    placeholder="Tell us what you liked..."
                ></textarea>

            </div>


            <button type="submit" class="primary-btn">
                Submit Feedback →
            </button>

            <button
                type="reset"
                class="reset-btn"
            >
                Reset
            </button>

        </form>

    </div>

</main>

<footer>
    © 2026 AgroSense Dynamics. All rights reserved.
</footer>

</body>
</html>
