<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroSense Dynamics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">A</span>
        <span>AgroSense <b>Dynamics</b></span>
    </a>

</nav>


<main class="login-page">

    <div class="login-background"></div>

    <section class="login-card glass reveal">

        <div class="brand-circle">
            🌱
        </div>

        <div class="badge">
            AGROSENSE DYNAMICS
        </div>

        <h1>
            Smart protection
            <span class="gradient">for farms.</span>
        </h1>

        <p class="muted">
            Enter your details to explore the AgroSense
            Dynamics smart agricultural protection system.
        </p>


        <form id="loginForm">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your complete address"
                required
            ></textarea>


            <button
                type="submit"
                class="btn primary"
            >
                Continue
                <span>→</span>
            </button>

        </form>

    </section>

</main>


<footer>
    © 2026 AgroSense Dynamics. All Rights Reserved.
</footer>


<script src="script.js"></script>

</body>
</html>
