<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSense Dynamics | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <div class="logo-box">A</div>
        <span>AgroSense Dynamics</span>
    </div>
</header>

<main class="login-page">

    <div class="login-card">

        <div class="small-badge">AGROSENSE DYNAMICS</div>

        <h1>
            Smart protection<br>
            <span>for modern farms.</span>
        </h1>

        <p class="login-description">
            Enter your details to explore the AgroSense Dynamics
            intelligent agricultural protection system.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="input-group">
                <label>Farm Address</label>
                <textarea
                    id="address"
                    placeholder="Enter your farm address"
                    required
                ></textarea>
            </div>

            <button type="submit" class="primary-btn">
                Continue →
            </button>

        </form>

    </div>

</main>

<footer>
    © 2026 AgroSense Dynamics. All rights reserved.
</footer>

<script src="script.js"></script>

</body>
</html>
